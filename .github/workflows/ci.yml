name: ⚡ CI Pipeline

on:
  push:
    branches:
      - main
      - development
      - feature/*
      - bugfix/*
  pull_request:
    branches:
      - main
      - development
      - feature/*
      - bugfix/*

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      CLIENT_DIR: client   # Frontend folder
      SERVER_DIR: server   # Backend folder

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: 📂 List repo files
        run: ls -la

      # ---------- Frontend ----------
      - name: 💾 Cache frontend dependencies
        uses: actions/cache@v3
        with:
          path: ${{ env.CLIENT_DIR }}/node_modules
          key: frontend-${{ runner.os }}-node-${{ hashFiles('${{ env.CLIENT_DIR }}/package-lock.json') }}
          restore-keys: |
            frontend-${{ runner.os }}-node-

      - name: 🎨 Install frontend dependencies
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm ci

      - name: 🏗️ Build frontend
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run build --if-present

      - name: 🧪 Run frontend tests
        working-directory: ${{ env.CLIENT_DIR }}
        run: npm run test --if-present

      # ---------- Backend ----------
      - name: 💾 Cache backend dependencies
        uses: actions/cache@v3
        with:
          path: ${{ env.SERVER_DIR }}/node_modules
          key: backend-${{ runner.os }}-node-${{ hashFiles('${{ env.SERVER_DIR }}/package-lock.json') }}
          restore-keys: |
            backend-${{ runner.os }}-node-

      - name: 🛠 Install backend dependencies
        working-directory: ${{ env.SERVER_DIR }}
        run: npm ci

      - name: 🧪 Run backend tests
        working-directory: ${{ env.SERVER_DIR }}
        run: npm run test --if-present

