# wrangler.toml — local dev config for Cloudflare Pages + Functions
name = "security-bank-portal"
compatibility_date = "2025-10-07"

# --- Static site output (Vite build) ---
[site]
bucket = "./dist"                   # Vite build output

# --- Environment variables ---
[vars]
VITE_API_BASE_URL = "https://localhost:5000"

# --- Local development config ---
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "https"