name: "🚀 Snapshot development → production"

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: snapshot-production
    cancel-in-progress: false

jobs:
    snapshot:
        runs-on: ubuntu-latest
        steps:
            - name: "🔒 Authorize Workflow Actor"
              run: |
                  if [ "$GITHUB_ACTOR" != "AlphaSweater" ]; then
                    echo "🚫 This workflow can only be triggered by AlphaSweater."
                    exit 1
                  fi

            - name: "📦 Checkout Repository"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "👤 Configure Git"
              run: |
                  git config --global user.name "$GITHUB_ACTOR"
                  git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: "📥 Fetch all branches"
              run: |
                  git fetch --all --prune

            - name: "🔍 Determine current SHAs"
              id: shas
              run: |
                  DEV_SHA=$(git rev-parse origin/development)
                  PROD_SHA=$(git rev-parse origin/production 2>/dev/null || echo "none")
                  echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
                  echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
                  if [ "$PROD_SHA" = "$DEV_SHA" ]; then
                    echo "needs_update=false" >> "$GITHUB_OUTPUT"
                    echo "✅ Production already matches development ($DEV_SHA)"
                  else
                    echo "needs_update=true" >> "$GITHUB_OUTPUT"
                    echo "ℹ️ Will update production from $PROD_SHA to $DEV_SHA"
                  fi

            - name: "🔄 Promote development → production"
              if: ${{ steps.shas.outputs.needs_update == 'true' }}
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  # Use PAT to bypass branch protection if needed
                  git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Checkout production (create if missing)
                  if git show-ref --verify --quiet refs/remotes/origin/production; then
                    git checkout production
                  else
                    git checkout -b production
                  fi

                  # Merge development into production with a marker commit
                  git merge --no-ff origin/development -m "🔄 Snapshot promotion: development → production"

                  # Push updated production branch
                  git push origin production

                  # Verify and summarize
                  NEW_PROD=$(git rev-parse HEAD)
                  echo "✅ production now at $NEW_PROD"
                  {
                    echo "### Snapshot complete"
                    echo
                    echo "\`\`\`"
                    echo "development: ${steps.shas.outputs.dev_sha}"
                    echo "production:  $NEW_PROD"
                    echo "\`\`\`"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: "🏷️ Tag production snapshot"
              if: ${{ steps.shas.outputs.needs_update == 'true' }}
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Use timestamp for unique tags
                  SNAPSHOT_TAG="prod-$(date +'%Y-%m-%d_%H-%M-%S')"

                  git tag -a "$SNAPSHOT_TAG" HEAD -m "Production snapshot from development"
                  git push origin "$SNAPSHOT_TAG"

                  echo "🏷️ Created tag: $SNAPSHOT_TAG"
                  echo "tag=$SNAPSHOT_TAG" >> "$GITHUB_OUTPUT"
