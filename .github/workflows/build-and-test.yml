name: 🚀 CI — Build & Test

on:
  push:
    branches: [development, production, "feature/*", "bugfix/*"]
  pull_request:
    branches: [development, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "20.x"

jobs:
  frontend:
    name: 🎨 Frontend • Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🏗️ Build
        run: npm run build

      - name: 🧪 Test
        run: npm test

      - name: 📤 Artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            client/dist
            client/build
          if-no-files-found: ignore
          retention-days: 7

  backend:
    name: 🛠️ Backend • Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 📦 Install
        run: npm ci

      - name: 🔨 Build
        run: npm run build

      - name: 🧪 Test
        run: npm test

      - name: 📤 Artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            server/dist
            server/build
          if-no-files-found: ignore
          retention-days: 7
