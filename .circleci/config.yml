# .circleci/config.yml
version: 2.1

orbs:
  node: circleci/node@5.2.0

# --- Jobs ---
jobs:
  frontend-build-test:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout
      - node/install-packages:
          app-dir: client
          pkg-manager: npm

      - run:
          name: 🏗️ Build (client)
          working_directory: client
          command: npm run build

      - run:
          name: 🧪 Test (client)
          working_directory: client
          command: npm test || true

      # Store build artifacts
      - store_artifacts:
          path: client/dist
          destination: frontend-dist

      - store_artifacts:
          path: client/build
          destination: frontend-build

  backend-build-test:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout
      - node/install-packages:
          app-dir: server
          pkg-manager: npm

      - run:
          name: 🔨 Build (server)
          working_directory: server
          command: npm run build

      - run:
          name: 🧪 Test (server)
          working_directory: server
          command: npm run test:ci

      - store_test_results:
          path: server/test-results

      # Coverage report (viewable HTML)
      - store_artifacts:
          path: server/coverage
          destination: backend-coverage

      # Store build artifacts
      - store_artifacts:
          path: server/dist
          destination: backend-dist

      - store_artifacts:
          path: server/build
          destination: backend-build

# --- Workflow ---
workflows:
  version: 2
  build-and-test:
    jobs:
      - frontend-build-test:
          name: "🎨 Frontend • Build & Test"

      - backend-build-test:
          name: "🛠️ Backend • Build & Test"
