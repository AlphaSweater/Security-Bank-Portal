version: 2.1

orbs:
  node: circleci/node@5.2.0

# --- Jobs ---
jobs:
  frontend-build-test:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout
      - node/install-packages:
          app-dir: client
          pkg-manager: npm

      - run:
          name: 🏗️ Build (client)
          working_directory: client
          command: npm run build

      - run:
          name: 🧪 Test (client)
          working_directory: client
          command: npm test || true

      - run:
          name: 📦 Collect Artifacts (client)
          command: |
            set -e
            mkdir -p /tmp/artifacts
            [ -d client/dist ]         && cp -R client/dist          /tmp/artifacts/client_dist          || true
            [ -d client/build ]        && cp -R client/build         /tmp/artifacts/client_build         || true
            [ -d client/coverage ]     && cp -R client/coverage      /tmp/artifacts/client_coverage      || true
            ls -la /tmp/artifacts || true
      - store_artifacts:
          path: /tmp/artifacts
          destination: frontend

  backend-build-test:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout
      - node/install-packages:
          app-dir: server
          pkg-manager: npm

      - run:
          name: 🔨 Build (server)
          working_directory: server
          command: npm run build

      - run:
          name: 🧪 Test (server)
          working_directory: server
          command: npm run test:ci

      - store_test_results:
          path: server/test-results

      - run:
          name: 📦 Collect Artifacts (server)
          command: |
            set -e
            mkdir -p /tmp/artifacts
            [ -d server/coverage ] && cp -R server/coverage /tmp/artifacts/server_coverage || true
            [ -d server/dist ]     && cp -R server/dist     /tmp/artifacts/server_dist     || true
            [ -d server/build ]    && cp -R server/build    /tmp/artifacts/server_build    || true
            ls -la /tmp/artifacts || true
      - store_artifacts:
          path: /tmp/artifacts
          destination: backend

      - persist_to_workspace:
          root: .
          paths:
            - server
            - sonar-project.properties

  sonar-scan:
    docker:
      - image: sonarsource/sonar-scanner-cli:5.0.1
    working_directory: ~/project
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: 🔎 SonarQube Scan (self-hosted)
          command: |
            sonar-scanner \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.login="${SONAR_TOKEN}" \
              -Dsonar.qualitygate.wait=true

# --- Workflow ---
workflows:
  version: 2
  build-test-scan:
    jobs:
      - frontend-build-test:
          name: "🎨 Frontend • Build & Test"
      - backend-build-test:
          name: "🛠️ Backend • Build & Test"
      - sonar-scan:
          name: "🧭 Sonar • Code Scan"
          requires:
            - "🎨 Frontend • Build & Test"
            - "🛠️ Backend • Build & Test"
