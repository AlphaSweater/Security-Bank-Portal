name: "📦 Sync Development → Production"

on:
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: "🔒 Authorize Workflow Actor"
              run: |
                  if [ "$GITHUB_ACTOR" != "AlphaSweater" ]; then
                    echo "🚫 This workflow can only be triggered by AlphaSweater."
                    exit 1
                  fi

            - name: "📦 Checkout Repository"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "👤 Configure Git User"
              run: |
                  git config --global user.name "$GITHUB_ACTOR"
                  git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: "🔄 Create Temp Sync Branch"
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  git fetch origin

                  # Short unique branch name
                  branch_name="sync/dev-prod-$(date +%Y%m%d-%H%M)"
                  git checkout -b "$branch_name" origin/development

                  # Merge production into temp, always favoring dev side
                  git merge origin/production -X ours -m "Sync production into $branch_name (favor dev side)"

                  git push https://x-access-token:${PAT_TOKEN}@github.com/AlphaSweater/Security-Bank-Portal.git "$branch_name"
                  echo "BRANCH_NAME=$branch_name" >> $GITHUB_ENV

            - name: "🚀 Create PR: Development → Production"
              id: create_pr
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  gh auth login --with-token < <(echo "$PAT_TOKEN")

                  branch_name="${BRANCH_NAME}"

                  # Create PR and capture URL from stdout
                  pr_url=$(gh pr create \
                    --base production \
                    --head "$branch_name" \
                    --title "📦 Sync development → production" \
                    --body "Automated sync of development into production. Conflicts resolved in favor of development.\n\nBranch: \`$branch_name\`" \
                    --label "sync" \
                    --assignee "AlphaSweater")

                  echo "PR_URL=$pr_url" >> $GITHUB_ENV
                  echo "✅ PR created: $pr_url"

            - name: "🤖 Enable Auto-Merge When Checks Pass"
              if: always()
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  gh auth login --with-token < <(echo "$PAT_TOKEN")
                  pr_url="${PR_URL}"
                  gh pr merge "$pr_url" --auto -m
