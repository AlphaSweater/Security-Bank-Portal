name: "🚀 Snapshot development → production"

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: snapshot-production
    cancel-in-progress: false

jobs:
    snapshot:
        runs-on: ubuntu-latest
        steps:
            - name: "🔒 Authorize Workflow Actor"
              run: |
                  if [ "$GITHUB_ACTOR" != "AlphaSweater" ]; then
                    echo "🚫 This workflow can only be triggered by AlphaSweater."
                    exit 1
                  fi

            - name: "📦 Checkout Repository"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "👤 Configure Git"
              run: |
                  git config --global user.name "$GITHUB_ACTOR"
                  git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: "📥 Fetch all branches"
              run: |
                  git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*

            - name: "🔍 Determine current SHAs/trees"
              id: shas
              run: |
                  set -e
                  DEV_SHA=$(git rev-parse origin/development)
                  DEV_TREE=$(git rev-parse origin/development^{tree})
                  PROD_SHA=$(git rev-parse origin/production 2>/dev/null || echo "none")
                  if [ "$PROD_SHA" != "none" ]; then
                    PROD_TREE=$(git rev-parse origin/production^{tree})
                  else
                    PROD_TREE="none"
                  fi

                  echo "dev_sha=$DEV_SHA" >> "$GITHUB_OUTPUT"
                  echo "dev_tree=$DEV_TREE" >> "$GITHUB_OUTPUT"
                  echo "prod_sha=$PROD_SHA" >> "$GITHUB_OUTPUT"
                  echo "prod_tree=$PROD_TREE" >> "$GITHUB_OUTPUT"

                  if [ "$PROD_TREE" = "$DEV_TREE" ]; then
                    echo "needs_update=false" >> "$GITHUB_OUTPUT"
                    echo "✅ Production content already matches development (tree $DEV_TREE)"
                  else
                    echo "needs_update=true" >> "$GITHUB_OUTPUT"
                    echo "ℹ️  Will update production (tree $PROD_TREE) → development (tree $DEV_TREE)"
                  fi

            - name: "🔄 Promote development → production (with marker)"
              if: ${{ steps.shas.outputs.needs_update == 'true' }}
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
                  DEV_SHA: ${{ steps.shas.outputs.dev_sha }}
                  PROD_SHA: ${{ steps.shas.outputs.prod_sha }}
              run: |
                  set -e
                  # Use PAT to ensure we can push to protected branches
                  git remote set-url origin "https://x-access-token:${PAT_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

                  # Create a local branch at the exact development commit
                  git checkout --detach "$DEV_SHA"
                  git checkout -B production

                  # Add a tiny marker commit without changing the tree
                  git commit --allow-empty \
                    -m "🔄 Snapshot promotion: development → production" \
                    -m "dev:  $DEV_SHA" \
                    -m "prev: ${PROD_SHA}" \
                    -m "by:   $GITHUB_ACTOR"

                  # Push production so that its content matches development (force) plus the marker commit on top
                  git push origin production --force

                  # Verify and summarize
                  git fetch origin production --prune
                  NEW_PROD=$(git rev-parse origin/production)
                  NEW_PROD_TREE=$(git rev-parse origin/production^{tree})
                  echo "✅ production now at $NEW_PROD"
                  {
                    echo "### Snapshot complete"
                    echo
                    echo "development: $DEV_SHA"
                    echo "production:  $NEW_PROD"
                    echo "tree:        $NEW_PROD_TREE"
                  } >> "$GITHUB_STEP_SUMMARY"
