version: 2.1

orbs:
  node: circleci/node@5.2.0

# Reusable keys
# Change "v1" if you ever want to force-invalidate all caches.
defaults: &cache-keys
  client: &client_cache_key v1-client-{{ arch }}-node-20.11-{{ checksum "client/package-lock.json" }}
  server: &server_cache_key v1-server-{{ arch }}-node-20.11-{{ checksum "server/package-lock.json" }}
  sonar: &sonar_cache_key v1-sonar-{{ arch }}-{{ .Environment.SONAR_SERVER_VERSION }}

# --- Jobs ---
jobs:
  frontend-build:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout

      # cache node_modules
      - restore_cache:
          keys:
            - *client_cache_key
      - node/install-packages:
          app-dir: client
          pkg-manager: npm
          include-branch-in-cache-key: false
      - save_cache:
          key: *client_cache_key
          paths:
            - client/node_modules

      - run:
          name: 🏗️ Build (client)
          working_directory: client
          command: npm run build

      - run:
          name: 📦 Collect Artifacts (client)
          command: |
            set -e
            mkdir -p /tmp/artifacts
            [ -d client/dist ]         && cp -R client/dist          /tmp/artifacts/client_dist          || true
            [ -d client/build ]        && cp -R client/build         /tmp/artifacts/client_build         || true
            ls -la /tmp/artifacts || true
      - store_artifacts:
          path: /tmp/artifacts
          destination: frontend
      - persist_to_workspace:
          root: .
          paths:
            - client

  backend-build-test:
    executor:
      name: node/default
      tag: "20.11"
    steps:
      - checkout

      # cache node_modules
      - restore_cache:
          keys:
            - *server_cache_key
      - node/install-packages:
          app-dir: server
          pkg-manager: npm
          include-branch-in-cache-key: false
      - save_cache:
          key: *server_cache_key
          paths:
            - server/node_modules

      - run:
          name: 🔨 Build (server)
          working_directory: server
          command: npm run build

      - run:
          name: 🧪 Test (server)
          working_directory: server
          command: npm run test:ci

      - store_test_results:
          path: server/test-results

      - run:
          name: 📦 Collect Artifacts (server)
          command: |
            set -e
            mkdir -p /tmp/artifacts
            [ -d server/coverage ] && cp -R server/coverage /tmp/artifacts/server_coverage || true
            [ -d server/dist ]     && cp -R server/dist     /tmp/artifacts/server_dist     || true
            [ -d server/build ]    && cp -R server/build    /tmp/artifacts/server_build    || true
            ls -la /tmp/artifacts || true
      - store_artifacts:
          path: /tmp/artifacts
          destination: backend

      - persist_to_workspace:
          root: .
          paths:
            - server
            - sonar-project.properties

  sonar-scan:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    steps:
      - checkout
      - attach_workspace: { at: . }

      # cache analyzers (~/.sonar/cache) so the second run is much faster
      - restore_cache:
          keys:
            - v1-sonar-{{ arch }}-{{ .Environment.SONAR_SERVER_VERSION }}

      - run:
          name: 🔎 SonarQube Scan (self-hosted)
          command: |
            echo "Node: $(node -v)"
            npx @sonar/scan@latest \
              -Dsonar.host.url="${SONAR_HOST_URL}" \
              -Dsonar.token="${SONAR_TOKEN}" \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.nodejs.executable="$(which node)"

      - save_cache:
          key: v1-sonar-{{ arch }}-{{ .Environment.SONAR_SERVER_VERSION }}
          paths:
            - ~/.sonar/cache

# --- Workflow ---
workflows:
  version: 2
  build-test-scan:
    jobs:
      - frontend-build-test:
          name: "🎨 Frontend • Build & Test"
      - backend-build-test:
          name: "🛠️ Backend • Build & Test"
      - sonar-scan:
          name: "🧭 Sonar • Code Scan"
          requires:
            - "🎨 Frontend • Build & Test"
            - "🛠️ Backend • Build & Test"
