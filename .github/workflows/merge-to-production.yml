name: "📦 Sync Development → Production"

on:
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - name: "🔒 Authorize Workflow Actor"
              run: |
                  if [ "$GITHUB_ACTOR" != "AlphaSweater" ]; then
                    echo "🚫 This workflow can only be triggered by AlphaSweater."
                    exit 1
                  fi

            - name: "📦 Checkout Repository"
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: "👤 Configure Git User"
              run: |
                  git config --global user.name "$GITHUB_ACTOR"
                  git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"

            - name: "🔄 Prepare Sync Branch"
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  git fetch origin

                  # Always reset a single sync branch from dev
                  if git show-ref --verify --quiet refs/remotes/origin/dev-to-prod-sync; then
                    git push origin --delete dev-to-prod-sync || true
                  fi

                  git checkout -b dev-to-prod-sync origin/development
                  git merge origin/production -X ours -m "Sync production into dev-to-prod-sync (favor dev side)"

                  git push --force https://x-access-token:${PAT_TOKEN}@github.com/AlphaSweater/Security-Bank-Portal.git dev-to-prod-sync

            - name: "🚀 Create or Update PR: Development → Production"
              env:
                  PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
              run: |
                  gh auth login --with-token < <(echo "$PAT_TOKEN")

                  # Look for existing sync PR
                  existing_pr=$(gh pr list --base production --head dev-to-prod-sync --state open --json number --jq '.[0].number')
                  if [ "$existing_pr" != "" ]; then
                    echo "🔗 PR already exists: #$existing_pr. Updating labels/assignee..."
                    gh pr edit $existing_pr --title "📦 Sync development → production" --add-label "sync" --add-assignee "AlphaSweater"
                    exit 0
                  fi

                  # Create a quiet PR
                  gh pr create \
                    --base production \
                    --head dev-to-prod-sync \
                    --title "📦 Sync development → production" \
                    --body "Automated sync of development into production. Conflicts resolved in favor of development." \
                    --label "sync" \
                    --assignee "AlphaSweater"
